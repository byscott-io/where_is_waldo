version: 2
# GitHub Packages reads use a repository-scoped, read-only packages token.
# It needs no repo or write access - keep it to read:packages only.
registries:
  github-gems:
    type: rubygems-server
    url: https://rubygems.pkg.github.com/byscott-io
    token: ${{ secrets.GH_PRIVATE_REPO_TOKEN }}
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.GH_PRIVATE_REPO_TOKEN }}
updates:
  - package-ecosystem: bundler
    directory: "/"
    cooldown:
      default-days: 7
    registries:
      - github-gems
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - "rubocop"
          - "rubocop-*"
          - "lefthook"
          - "rspec-rails"
          - "faker"
          - "factory_bot_rails"
          - "shoulda-matchers"
          - "brakeman"
          - "bundler-audit"
        update-types:
          - "minor"
          - "patch"
    # json 3 removed JSON.parse's positional options, which
    # ActiveSupport::JSON.decode still passes - every ActiveRecord json column
    # raises on deserialize. Fixed in rails/rails#58601 but not in any release
    # yet. Dependabot rewrites the Gemfile pin rather than respecting it, so the
    # guard has to live here too. Drop this once a Rails release carries the fix.
    ignore:
      - dependency-name: "json"
        versions: [">= 3.a"]
  - package-ecosystem: npm
    directory: "/"
    cooldown:
      default-days: 7
    registries:
      - github-npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # react and react-dom must resolve to the EXACT same version or React
      # refuses to start ("Incompatible React versions"). Ungrouped, Dependabot
      # proposes them separately and the first PR always fails its tests.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "prettier"
          - "vitest"
          - "@vitest/*"
          - "jest"
          - "@testing-library/*"
          - "postcss"
          - "postcss-*"
          - "sass"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
