version: 2
registries:
  github-gems:
    type: rubygems-server
    url: https://rubygems.pkg.github.com/byscott-io
    token: ${{ secrets.GH_PRIVATE_REPO_TOKEN }}
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.GH_PRIVATE_REPO_TOKEN }}
updates:
  - package-ecosystem: bundler
    directory: "/"
    cooldown:
      default-days: 7
    registries:
      - github-gems
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - "rubocop"
          - "rubocop-*"
          - "lefthook"
          - "rspec-rails"
          - "faker"
          - "factory_bot_rails"
          - "shoulda-matchers"
          - "brakeman"
          - "bundler-audit"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: npm
    directory: "/"
    cooldown:
      default-days: 7
    registries:
      - github-npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "prettier"
          - "vitest"
          - "@vitest/*"
          - "jest"
          - "@testing-library/*"
          - "postcss"
          - "postcss-*"
          - "sass"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
