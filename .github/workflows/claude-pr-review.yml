# Thin caller — delegates to the centralized public reusable workflow.
# All review logic (prompt, skip rules, action config) lives in
# byscott-io/workflows; edit it there to change behavior fleet-wide.
name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    uses: byscott-io/workflows/.github/workflows/claude-pr-review.yml@master
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_GH_TOKEN: ${{ secrets.CLAUDE_GH_TOKEN }}
