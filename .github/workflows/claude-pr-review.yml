# Thin caller — delegates to the centralized reusable workflow in infrabyscott.
# All review logic (prompt, skip rules, action config) lives there; edit it in
# infra to change behavior fleet-wide. Do not add logic here.
name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]

# Required: reusable workflows can't exceed the caller's token, and the repo
# default is read-only. Grant here what the reusable needs.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: byscott-io/infrabyscott/.github/workflows/claude-pr-review.yml@master
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
