# Thin caller — @claude mentions delegate to the centralized reusable workflow.
name: Claude Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Required: reusable workflows can't exceed the caller's token, and the repo
# default is read-only. Grant here what the reusable needs.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    uses: byscott-io/infrabyscott/.github/workflows/claude-mention.yml@master
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
