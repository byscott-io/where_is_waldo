# Thin caller — @claude mentions delegate to the centralized reusable workflow.
name: Claude Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# No write permissions declared — the enterprise forbids it and rejects the run.
# Writes flow through CLAUDE_GH_TOKEN (a PAT) inside the reusable workflow.
permissions:
  contents: read

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    uses: byscott-io/infrabyscott/.github/workflows/claude-mention.yml@master
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_GH_TOKEN: ${{ secrets.CLAUDE_GH_TOKEN }}
